<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Air Drawing Recognition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 95vw;
      max-height: 80vh;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid #30363d;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #overlay-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .badge-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #30363d;
      font-weight: bold;
      font-size: 1.2rem;
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .color-preview {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid #fff;
    }
    #badge-3d {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #ffb43c;
      color: #ffb43c;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
    }
    .controls-hint {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      font-size: 0.85rem;
      color: #8b949e;
      text-align: center;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="container">
    <video id="webcam" playsinline></video>
    <canvas id="output_canvas" width="1280" height="720"></canvas>

    <div id="overlay-ui">
      <div class="badge-row">
        <div class="badge">
          <span id="mode-text" style="color: #38ef7d;">MODE: DRAW</span>
          <div id="color-box" class="color-preview" style="background: rgb(60, 220, 255);"></div>
        </div>
        <div id="badge-3d">3D</div>
      </div>
      <div class="controls-hint">
        👆 Point = Draw &nbsp;|&nbsp; ✌️ Peace = Move &nbsp;|&nbsp; 🖖 3 Fingers = Undo &nbsp;|&nbsp;
        ✋ Palm = Redo &nbsp;|&nbsp; 👌 OK = Clear &nbsp;|&nbsp; 👍 Thumb = Color &nbsp;|&nbsp;
        🤘 Rock On = Toggle 3D
      </div>
    </div>
  </div>


  <script src="gesture.js"></script>
  <script src="recognizer.js"></script>
  <script src="shape3d.js"></script>
  <script src="draw.js"></script>
</body>
</html>
